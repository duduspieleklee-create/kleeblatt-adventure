<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kleinanzeigen Adventure | Gala Playworks Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      padding: 10px;
      padding-bottom: 140px;
    }
    
    #game-container {
      width: 800px;
      height: 600px;
      max-width: 100vw;
      max-height: calc(100vh - 150px);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(246,65,108,0.5);
    }
    
    #debug-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 130px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.9);
      color: #ff4444;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 8px;
      border-top: 2px solid #ff4444;
      z-index: 9999;
      display: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    #debug-panel.visible {
      display: block;
    }
    
    .debug-entry {
      margin: 2px 0;
      padding: 2px 4px;
      border-bottom: 1px solid rgba(255, 68, 68, 0.2);
    }
    
    .debug-error {
      color: #ff4444;
      font-weight: bold;
    }
    
    .debug-warn {
      color: #ffaa00;
    }
    
    .debug-info {
      color: #44aaff;
    }
    
    #debug-toggle {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: #ff4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      z-index: 10000;
      font-family: Arial, sans-serif;
    }
    
    #debug-toggle:hover {
      background: #cc3333;
    }
    
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
    }
    
    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid #f6416c;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    #mobile-controls {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
    }
    
    #joystick-base {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 3px solid rgba(255, 255, 255, 0.5);
      position: relative;
      touch-action: none;
    }
    
    #joystick-stick {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(246, 65, 108, 0.8);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(246, 65, 108, 0.5);
    }
    
    @media (max-width: 768px) {
      #mobile-controls {
        display: block;
      }
      
      #game-container {
        max-height: calc(100vh - 200px);
      }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  
  <div id="mobile-controls">
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>
  </div>
  
  <div id="debug-panel"></div>
  <button id="debug-toggle" onclick="toggleDebug()">Debug</button>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
