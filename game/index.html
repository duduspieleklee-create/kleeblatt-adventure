<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kleinanzeigen Adventure | Gala Playworks Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      padding: 10px;
      padding-bottom: 140px;
    }
    
    #game-container {
      width: 800px;
      height: 600px;
      max-width: 100vw;
      max-height: calc(100vh - 150px);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(246,65,108,0.5);
    }
    
    #debug-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 130px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.9);
      color: #ff4444;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 8px;
      border-top: 2px solid #ff4444;
      z-index: 9999;
      display: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    #debug-panel.visible {
      display: block;
    }
    
    .debug-entry {
      margin: 2px 0;
      padding: 2px 4px;
      border-bottom: 1px solid rgba(255, 68, 68, 0.2);
    }
    
    .debug-error {
      color: #ff4444;
      font-weight: bold;
    }
    
    .debug-warn {
      color: #ffaa00;
    }
    
    .debug-info {
      color: #44aaff;
    }
    
    #debug-toggle {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: #ff4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      z-index: 10000;
      font-family: Arial, sans-serif;
    }
    
    #debug-toggle:hover {
      background: #cc3333;
    }
    
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
    }
    
    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid #f6416c;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    #mobile-controls {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
    }
    
    #joystick-base {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 3px solid rgba(255, 255, 255, 0.5);
      position: relative;
      touch-action: none;
    }
    
    #joystick-stick {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(246, 65, 108, 0.8);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(246, 65, 108, 0.5);
    }
    
    #username-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 20000;
      flex-direction: column;
    }
    
    #username-overlay.visible {
      display: flex;
    }
    
    #username-box {
      background: #1a1a2e;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      border: 2px solid #f6416c;
      max-width: 360px;
      width: 90%;
    }
    
    #username-box h3 {
      color: white;
      margin-bottom: 6px;
      font-size: 18px;
    }
    
    #username-box .desc {
      color: #a0aec0;
      margin-bottom: 14px;
      font-size: 13px;
    }
    
    .username-input-row {
      position: relative;
      margin-bottom: 10px;
    }
    
    .username-input-row input {
      width: 100%;
      padding: 10px 44px 10px 14px;
      border-radius: 6px;
      border: 2px solid #4a5568;
      background: #2d3748;
      color: white;
      font-size: 16px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .username-input-row input:focus {
      border-color: #a0aec0;
    }
    
    .username-input-row input.valid {
      border-color: #22c55e;
    }
    
    .username-input-row input.invalid {
      border-color: #ef4444;
    }
    
    #username-status {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    
    #username-status .checking {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top: 2px solid #f6416c;
      border-radius: 50%;
      animation: username-spin 0.8s linear infinite;
    }
    
    #username-status .available {
      color: #22c55e;
    }
    
    #username-status .taken {
      color: #ef4444;
    }
    
    @keyframes username-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    #username-hint {
      font-size: 11px;
      color: #718096;
      margin-bottom: 14px;
      min-height: 16px;
    }
    
    #username-hint.error {
      color: #ef4444;
    }
    
    #username-box .btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    
    #username-box button {
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    
    #username-confirm {
      background: #f6416c;
      color: white;
    }
    
    #username-confirm:hover:not(:disabled) {
      background: #d6335c;
    }
    
    #username-confirm:disabled {
      background: #4a5568;
      cursor: not-allowed;
      opacity: 0.6;
    }
    
    #username-skip {
      background: #4a5568;
      color: #e2e8f0;
    }
    
    #username-skip:hover {
      background: #3a4568;
    }
    
    @media (max-width: 768px) {
      #mobile-controls {
        display: block;
      }
      
      #game-container {
        max-height: calc(100vh - 200px);
      }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  
  <div id="mobile-controls">
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>
  </div>
  
  <div id="username-overlay">
    <div id="username-box">
      <h3 id="username-title">Choose your username</h3>
      <div id="username-desc" class="desc">Pick a permanent username</div>
      <div class="username-input-row">
        <input id="username-input" type="text" placeholder="Your username" maxlength="24" autocomplete="off" autocomplete="off">
        <div id="username-status"></div>
      </div>
      <div id="username-hint">3-24 characters: a-z, A-Z, 0-9, _ , -</div>
      <div class="btn-row">
        <button id="username-confirm" disabled>Confirm</button>
        <button id="username-skip">Skip</button>
      </div>
    </div>
  </div>
  
  <div id="debug-panel"></div>
  <button id="debug-toggle" onclick="toggleDebug()">Debug</button>
  
  <script type="module" src="/src/main.js"></script>
  <script>
    let _usernameCallback = null;
    let _usernameSkip = true;
    let _usernameTimer = null;
    
    const API_BASE = 'https://game.kleeblatt.space/api/game';
    const $overlay = document.getElementById('username-overlay');
    const $title = document.getElementById('username-title');
    const $desc = document.getElementById('username-desc');
    const $input = document.getElementById('username-input');
    const $status = document.getElementById('username-status');
    const $hint = document.getElementById('username-hint');
    const $confirm = document.getElementById('username-confirm');
    const $skip = document.getElementById('username-skip');
    
    function setStatus(html) {
      $status.innerHTML = html;
    }
    
    function clearStatus() {
      $status.innerHTML = '';
      $input.className = '';
      $confirm.disabled = true;
    }
    
    async function validateUsername(val) {
      if (val.length < 3) {
        $hint.textContent = 'Minimum 3 characters';
        $hint.className = 'error';
        setStatus('');
        $input.className = '';
        $confirm.disabled = true;
        return;
      }
      
      if (!/^[a-zA-Z0-9_-]+$/.test(val)) {
        $hint.textContent = 'Only letters, numbers, _ and - allowed';
        $hint.className = 'error';
        setStatus('');
        $input.className = '';
        $confirm.disabled = true;
        return;
      }
      
      setStatus('<div class="checking"></div>');
      $hint.textContent = 'Checking availability...';
      $hint.className = '';
      $input.className = '';
      $confirm.disabled = true;
      
      try {
        const res = await fetch(API_BASE + '/check-username?username=' + encodeURIComponent(val));
        const data = await res.json();
        
        if (data.available) {
          $input.className = 'valid';
          setStatus('<span class="available">&#10003;</span>');
          $hint.textContent = 'Username available!';
          $hint.className = '';
          $confirm.disabled = false;
        } else {
          $input.className = 'invalid';
          setStatus('<span class="taken">&#10007;</span>');
          $hint.textContent = 'Username already taken';
          $hint.className = 'error';
          $confirm.disabled = true;
        }
      } catch {
        setStatus('<span style="color:#fbbf24">&#9888;</span>');
        $hint.textContent = 'Could not verify. You can still try.';
        $hint.className = '';
        $input.className = 'valid';
        $confirm.disabled = false;
      }
    }
    
    $input.addEventListener('input', function() {
      clearTimeout(_usernameTimer);
      const val = this.value.trim();
      if (!val) {
        clearStatus();
        $hint.textContent = '3-24 characters: a-z, A-Z, 0-9, _ , -';
        $hint.className = '';
        return;
      }
      _usernameTimer = setTimeout(() => validateUsername(val), 400);
    });
    
    window._showUsernamePrompt = function(title, desc, canSkip, callback) {
      _usernameCallback = callback;
      _usernameSkip = canSkip !== false;
      $title.textContent = title || 'Choose your username';
      $desc.textContent = desc || 'Pick a permanent username';
      $input.value = '';
      $input.className = '';
      clearStatus();
      $hint.textContent = '3-24 characters: a-z, A-Z, 0-9, _ , -';
      $hint.className = '';
      $confirm.disabled = true;
      $skip.style.display = _usernameSkip ? '' : 'none';
      $overlay.classList.add('visible');
      $input.focus();
    };
    
    window._hideUsernamePrompt = function() {
      $overlay.classList.remove('visible');
      _usernameCallback = null;
      clearTimeout(_usernameTimer);
    };
    
    $confirm.addEventListener('click', function() {
      const val = $input.value.trim();
      if (!val || val.length < 3) return;
      const cb = _usernameCallback;
      window._hideUsernamePrompt();
      if (cb) cb(val);
    });
    
    $skip.addEventListener('click', function() {
      const cb = _usernameCallback;
      window._hideUsernamePrompt();
      if (cb) cb(null);
    });
    
    $input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const val = $input.value.trim();
        if (!val || val.length < 3) return;
        const cb = _usernameCallback;
        window._hideUsernamePrompt();
        if (cb) cb(val);
      }
    });
  </script>
</body>
</html>
