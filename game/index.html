<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kleinanzeigen Adventure | Gala Playworks Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      padding: 10px;
      padding-bottom: 140px;
    }
    
    #game-container {
      width: 800px;
      height: 600px;
      max-width: 100vw;
      max-height: calc(100vh - 150px);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(246,65,108,0.5);
    }
    
    #debug-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 130px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.9);
      color: #ff4444;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 8px;
      border-top: 2px solid #ff4444;
      z-index: 9999;
      display: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    #debug-panel.visible {
      display: block;
    }
    
    .debug-entry {
      margin: 2px 0;
      padding: 2px 4px;
      border-bottom: 1px solid rgba(255, 68, 68, 0.2);
    }
    
    .debug-error {
      color: #ff4444;
      font-weight: bold;
    }
    
    .debug-warn {
      color: #ffaa00;
    }
    
    .debug-info {
      color: #44aaff;
    }
    
    #debug-toggle {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: #ff4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      z-index: 10000;
      font-family: Arial, sans-serif;
    }
    
    #debug-toggle:hover {
      background: #cc3333;
    }
    
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
    }
    
    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid #f6416c;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    #mobile-controls {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
    }
    
    #joystick-base {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 3px solid rgba(255, 255, 255, 0.5);
      position: relative;
      touch-action: none;
    }
    
    #joystick-stick {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(246, 65, 108, 0.8);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(246, 65, 108, 0.5);
    }
    
    #username-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 20000;
      flex-direction: column;
    }
    
    #username-overlay.visible {
      display: flex;
    }
    
    #username-box {
      background: #1a1a2e;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      border: 2px solid #f6416c;
      max-width: 340px;
      width: 90%;
    }
    
    #username-box h3 {
      color: white;
      margin-bottom: 8px;
      font-size: 18px;
    }
    
    #username-box p {
      color: #a0aec0;
      margin-bottom: 16px;
      font-size: 13px;
    }
    
    #username-box input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #4a5568;
      background: #2d3748;
      color: white;
      font-size: 16px;
      text-align: center;
      margin-bottom: 16px;
      outline: none;
    }
    
    #username-box input:focus {
      border-color: #f6416c;
    }
    
    #username-box button {
      background: #f6416c;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin: 0 4px;
    }
    
    #username-box button:hover {
      background: #d6335c;
    }
    
    #username-box .skip-btn {
      background: #4a5568;
    }
    
    #username-box .skip-btn:hover {
      background: #3a4568;
    }
    
    @media (max-width: 768px) {
      #mobile-controls {
        display: block;
      }
      
      #game-container {
        max-height: calc(100vh - 200px);
      }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  
  <div id="mobile-controls">
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>
  </div>
  
  <div id="username-overlay">
    <div id="username-box">
      <h3 id="username-title">Choose your username</h3>
      <p id="username-desc">Or leave empty for a random one</p>
      <input id="username-input" type="text" placeholder="Your username" maxlength="24" autocomplete="off">
      <div>
        <button id="username-confirm">Confirm</button>
        <button id="username-skip" class="skip-btn">Skip</button>
      </div>
    </div>
  </div>
  
  <div id="debug-panel"></div>
  <button id="debug-toggle" onclick="toggleDebug()">Debug</button>
  
  <script type="module" src="/src/main.js"></script>
  <script>
    let _usernameCallback = null;
    
    window._showUsernamePrompt = function(title, desc, callback) {
      _usernameCallback = callback;
      document.getElementById('username-title').textContent = title || 'Choose your username';
      document.getElementById('username-desc').textContent = desc || 'Or leave empty for a random one';
      document.getElementById('username-input').value = '';
      document.getElementById('username-overlay').classList.add('visible');
      document.getElementById('username-input').focus();
    };
    
    window._hideUsernamePrompt = function() {
      document.getElementById('username-overlay').classList.remove('visible');
      _usernameCallback = null;
    };
    
    document.getElementById('username-confirm').addEventListener('click', function() {
      const val = document.getElementById('username-input').value.trim() || null;
      window._hideUsernamePrompt();
      if (_usernameCallback) _usernameCallback(val);
    });
    
    document.getElementById('username-skip').addEventListener('click', function() {
      window._hideUsernamePrompt();
      if (_usernameCallback) _usernameCallback(null);
    });
    
    document.getElementById('username-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('username-confirm').click();
    });
  </script>
</body>
</html>
