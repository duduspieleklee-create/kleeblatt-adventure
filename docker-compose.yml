services:
  postgres:
    image: postgres:16-alpine
    container_name: kleeblatt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kleeblatt
      POSTGRES_PASSWORD: kleeblatt
      POSTGRES_DB: kleeblatt
    ports:
      - "5432:5432"
    volumes:
      - kleeblatt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kleeblatt -d kleeblatt"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kleeblatt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kleeblatt_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  kleeblatt_pg_data:
  kleeblatt_redis_data:
