name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Format check (source)
        run: npx prettier --check "apps/**/*.{ts,tsx,js,css,html}" "packages/**/*.{ts,tsx,js}" "scripts/**/*.{js,mjs}" "package.json" "eslint.config.js" "vitest.config.ts" "turbo.json" "README.md" "CONTRIBUTING.md" "STRUCTURE.md" ".github/workflows/*.yml"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kleeblatt
          POSTGRES_PASSWORD: kleeblatt
          POSTGRES_DB: kleeblatt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kleeblatt:kleeblatt@localhost:5432/kleeblatt_test
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-test-secret-do-not-use-in-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
