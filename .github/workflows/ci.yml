name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck            
      - name: Lint (auto-fix then check)
        run: |
          # Run inside the web workspace so local workspace eslint and config are used
          cd apps/web

          # Attempt to auto-fix fixable issues. Allow this command to exit non-zero
          # so we still perform the strict check afterwards.
          npx eslint "src/**/*.{js,jsx,ts,tsx}" --fix || true

          # Enforce zero warnings/errors after auto-fix
          npx eslint "src/**/*.{js,jsx,ts,tsx}" --max-warnings 0
         npm run lint

      - name: Build shared + web
        run: npm run build:web

      - name: Build API
        run: npm run build:api

      - name: Test
        run: npm test
