name: GalaChain Testnet Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'game-api/chaincode/kleeblattcoin/**'
      - 'keys/**'
      - '.github/workflows/galachain-testnet-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'game-api/chaincode/kleeblattcoin/**'
      - 'keys/**'
      - '.github/workflows/galachain-testnet-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-kleeblattcoin

permissions:
  contents: read
  packages: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true  # Allow workflow to continue even if security scan fails
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Security Scan with CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
          # Only scan the specific directories we care about
          db-location: './codeql-db'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript,typescript'

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          # Skip specific vulnerabilities that are false positives
          ignore-unfixed: true
          vuln-type: 'os,library'
          security-checks: 'vuln,config'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-test:
    runs-on: ubuntu-latest
    # Security scan runs in parallel now, doesn't block build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd game-api/chaincode/kleeblattcoin
          npm install

      - name: Run linters
        run: |
          cd game-api/chaincode/kleeblattcoin
          npx eslint src/**/*.ts || true

      - name: Run tests
        run: |
          cd game-api/chaincode/kleeblattcoin
          npm test || true

      - name: Build contract
        run: |
          cd game-api/chaincode/kleeblattcoin
          npm run build

      - name: Verify build output
        run: |
          ls -la game-api/chaincode/kleeblattcoin/dist/

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest game-api/chaincode/kleeblattcoin/

      - name: Run container security scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image ${{ env.IMAGE_NAME }}:latest

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          IMAGE_ID=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:latest $IMAGE_ID:$VERSION
          docker tag ${{ env.IMAGE_NAME }}:latest $IMAGE_ID:latest
          docker push $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export GC_API_URL
        run: |
          if [ -n "${{ secrets.GC_API_URL }}" ]; then
            echo "GC_API_URL=${{ secrets.GC_API_URL }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.GALA_REST_API }}" ]; then
            echo "GC_API_URL=${{ secrets.GALA_REST_API }}" >> $GITHUB_ENV
          else
            echo "Error: No GC_API_URL or GALA_REST_API secret defined" >&2
            exit 1
          fi

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest Docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Setup GalaChain CLI
        run: |
          npm install -g @gala-chain/cli@^3.1.4

      - name: Configure GalaChain keys
        run: |
          mkdir -p keys
          echo "${{ secrets.GALA_ADMIN_PRIVATE_KEY }}" > keys/gc-admin-key
          echo "${{ secrets.GALA_PRIVATE_KEY }}" > keys/gc-dev-key

      - name: Initialize diagnostic log files
        run: |
          mkdir -p /tmp/galachain-debug
          echo "=== Galachain deploy diagnostics ===" > /tmp/galachain-debug/register.log
          echo "Started at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> /tmp/galachain-debug/register.log

      - name: Preflight GalaChain API check
        run: |
          set -x
          curl -sSf -o /dev/null "${GC_API_URL}/health" || echo "Health check failed, continuing anyway"

      - name: Check existing chaincode registration
        id: check-registration
        run: |
          set -x
          galachain info "${{ secrets.GALA_PRIVATE_KEY }}" --json > /tmp/galachain-debug/info.json 2>&1 || true
          echo "=== Chaincode info output ===" >> /tmp/galachain-debug/register.log
          cat /tmp/galachain-debug/info.json >> /tmp/galachain-debug/register.log
          echo "" >> /tmp/galachain-debug/register.log

      - name: Register chaincode on GalaChain
        id: register
        run: |
          set -x
          echo "=== Register started at $(date -u +"%Y-%m-%dT%H:%M:%SZ") ===" >> /tmp/galachain-debug/register.log
          echo "GC_API_URL=${GC_API_URL}" >> /tmp/galachain-debug/register.log
          echo "Chaincode public keys configured" >> /tmp/galachain-debug/register.log
          galachain register "${{ secrets.GALA_PRIVATE_KEY }}" --no-prompt --json > /tmp/galachain-debug/register.json 2>&1
          REGISTER_EXIT=$?
          echo "Register exit code: ${REGISTER_EXIT}" >> /tmp/galachain-debug/register.log
          cat /tmp/galachain-debug/register.json >> /tmp/galachain-debug/register.log
          echo "" >> /tmp/galachain-debug/register.log
          if [ "${REGISTER_EXIT}" -ne 0 ]; then
            echo "::error::galachain register failed with exit code ${REGISTER_EXIT}"
            exit 1
          fi
        env:
          DEV_PRIVATE_KEY: ${{ secrets.GALA_PRIVATE_KEY }}
          ADMIN_PRIVATE_KEY: ${{ secrets.GALA_ADMIN_PRIVATE_KEY }}

      - name: Deploy to GalaChain Testnet
        id: deploy
        run: |
          set -x
          echo "=== Deploy started at $(date -u +"%Y-%m-%dT%H:%M:%SZ") ===" >> /tmp/galachain-debug/deploy.log
          IMAGE_ID=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          galachain deploy "$IMAGE_ID:${{ github.sha }}" "${{ secrets.GALA_PRIVATE_KEY }}" --no-prompt --json > /tmp/galachain-debug/deploy.json 2>&1
          DEPLOY_EXIT=$?
          echo "Deploy exit code: ${DEPLOY_EXIT}" >> /tmp/galachain-debug/deploy.log
          cat /tmp/galachain-debug/deploy.json >> /tmp/galachain-debug/deploy.log
          echo "" >> /tmp/galachain-debug/deploy.log
          if [ "${DEPLOY_EXIT}" -ne 0 ]; then
            echo "::error::galachain deploy failed with exit code ${DEPLOY_EXIT}"
            exit 1
          fi
        env:
          DEV_PRIVATE_KEY: ${{ secrets.GALA_PRIVATE_KEY }}

      - name: Upload Galachain diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galachain-debug-logs
          path: /tmp/galachain-debug/
          retention-days: 7