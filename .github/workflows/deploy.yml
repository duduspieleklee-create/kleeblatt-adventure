name: Auto Deploy with PR & Changelog
on:
  push:
    branches:
      - master
      - 'gh-pages'
  schedule:
    - cron: '0 0 * * *'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci && npm run build
        working-directory: ./game
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./game/dist
          publish_branch: gh-pages
      - uses: peter-evans/create-pull-request@v5
        if: github.ref == 'refs/heads/master'
        with:
          title: '🚀 Deployed to kleeblatt.space'
          body: |
            ## Deployment Log
            Source: ${{ github.ref }}
            Time: ${{ github.event.head_commit.timestamp }}
            
            ### Live at
            https://kleeblatt.space/game
            
            ### Build Details
            Platform: GitHub Actions/Vite
            Files: game/dist/*
            
            ### Auto-changelog
            Labels: deploy auto-update v1.0
            
            Review: https://github.com/pull/new/deploy
          labels: 'deploy auto-update changelog'
          reviewers: ${{ github.repository_owner }}
          assignees: ${{ github.actor }}

