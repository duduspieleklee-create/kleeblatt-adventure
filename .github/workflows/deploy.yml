name: Deploy Stage (kleeblatt-adventure)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-stage
  cancel-in-progress: true

jobs:
  # ── Job 1: Build and deploy the application (web + api) ──────────────
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared + api + web (turbo)
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # On-chain contract addresses (Immutable zkEVM Testnet, chainId 13473).
          # These GitHub secrets were never passed to the Vite build before,
          # which made Staking / Shop throw "… not configured" in the bundle.
          VITE_STAKING_CONTRACT_ADDRESS: ${{ secrets.VITE_STAKING_CONTRACT_ADDRESS }}
          VITE_KLT_CONTRACT_ADDRESS: ${{ secrets.VITE_KLT_CONTRACT_ADDRESS }}
        run: npx turbo run build --filter=@kleeblatt/shared --filter=@kleeblatt/api --filter=@kleeblatt/web

      - name: Verify build artifacts
        run: |
          test -f apps/web/dist/index.html
          test -f apps/api/dist/index.js
          test -f packages/shared/dist/index.js

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_STAGE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_STAGE_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to stage
        env:
          DEPLOY_STAGE_HOST: ${{ secrets.DEPLOY_STAGE_HOST }}
          DEPLOY_STAGE_USER: ${{ secrets.DEPLOY_STAGE_USER }}
          DEPLOY_STAGE_PORT: ${{ secrets.DEPLOY_STAGE_PORT }}
          WEB_PATH: /var/www/stage
          API_PATH: /opt/kleeblatt-adventure
          STAGE_WEB_URL: https://stage.kleeblatt.space
          STAGE_CORS_ORIGIN: https://stage.kleeblatt.space
          STAGE_VITE_API_URL: https://stage.kleeblatt.space
          STAGE_SESSION_SECRET: ${{ secrets.STAGE_SESSION_SECRET }}
          STAGE_DATABASE_URL: ${{ secrets.STAGE_DATABASE_URL }}
          STAGE_REDIS_URL: ${{ secrets.STAGE_REDIS_URL }}
          STAGE_GOOGLE_CLIENT_ID: ${{ secrets.STAGE_GOOGLE_CLIENT_ID }}
          STAGE_GOOGLE_CLIENT_SECRET: ${{ secrets.STAGE_GOOGLE_CLIENT_SECRET }}
          STAGE_GOOGLE_CALLBACK_URL: https://stage.kleeblatt.space/auth/google/callback
          STAGE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          STAGE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STAGE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STAGE_SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          STAGE_SUPABASE_AUTH_URL: ${{ secrets.SUPABASE_URL }}/auth/v1
        run: bash scripts/server-deploy-stage.sh

  # ── Job 2: Deploy self-hosted Supabase stack (11 containers) ─────────
  # Runs in parallel with the app deploy. Syncs the version-controlled
  # Supabase Docker config from infra/supabase/ to /opt/supabase/docker/
  # on the VPS, writes .env from secrets, and runs docker compose up -d.
  # Only triggers when infra/supabase/** or the deploy script changes.
  deploy-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Supabase config changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            supabase:
              - 'infra/supabase/**'
              - 'scripts/server-deploy-supabase.sh'

      - name: Skip if no Supabase changes
        if: steps.changes.outputs.supabase != 'true'
        run: echo "No Supabase config changes — skipping."

      - name: Setup SSH key
        if: steps.changes.outputs.supabase == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_STAGE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_STAGE_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Supabase stack
        if: steps.changes.outputs.supabase == 'true'
        env:
          DEPLOY_STAGE_HOST: ${{ secrets.DEPLOY_STAGE_HOST }}
          DEPLOY_STAGE_USER: ${{ secrets.DEPLOY_STAGE_USER }}
          DEPLOY_STAGE_PORT: ${{ secrets.DEPLOY_STAGE_PORT }}
          # Supabase secrets — written to /opt/supabase/docker/.env on the VPS
          SUPABASE_POSTGRES_PASSWORD: ${{ secrets.SUPABASE_POSTGRES_PASSWORD }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DASHBOARD_PASSWORD: ${{ secrets.SUPABASE_DASHBOARD_PASSWORD }}
          SUPABASE_PUBLIC_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_EXTERNAL_URL: ${{ secrets.SUPABASE_URL }}/auth/v1
          SUPABASE_SITE_URL: ${{ secrets.SUPABASE_URL }}
        run: bash scripts/server-deploy-supabase.sh

  # ── Job 3: Run database migrations against Supabase Postgres ────────
  # Runs after both app and Supabase deploys complete (needs Supabase DB
  # running). Syncs apps/api/drizzle/*.sql to the VPS and applies them
  # in order via docker exec psql against the supabase-db container.
  # Only triggers when apps/api/drizzle/** or the migration script changes.
  deploy-migrations:
    runs-on: ubuntu-latest
    needs: [build-and-deploy, deploy-supabase]
    steps:
      - uses: actions/checkout@v4

      - name: Check for migration changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            migrations:
              - 'apps/api/drizzle/**'
              - 'scripts/server-deploy-migrations.sh'

      - name: Skip if no migration changes
        if: steps.changes.outputs.migrations != 'true'
        run: echo "No migration changes — skipping."

      - name: Setup SSH key
        if: steps.changes.outputs.migrations == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_STAGE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_STAGE_HOST }}" >> ~/.ssh/known_hosts

      - name: Run migrations
        if: steps.changes.outputs.migrations == 'true'
        env:
          DEPLOY_STAGE_HOST: ${{ secrets.DEPLOY_STAGE_HOST }}
          DEPLOY_STAGE_USER: ${{ secrets.DEPLOY_STAGE_USER }}
          DEPLOY_STAGE_PORT: ${{ secrets.DEPLOY_STAGE_PORT }}
          API_PATH: /opt/kleeblatt-adventure
        run: bash scripts/server-deploy-migrations.sh
