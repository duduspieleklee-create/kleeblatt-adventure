name: Auto Deploy with PR & Changelog

# ═══════════════════════════════════════════════════════
# Required GitHub Secrets (Settings → Secrets → Actions)
# ═══════════════════════════════════════════════════════
#
#   DEPLOY_SSH_KEY       — SSH private key for server access
#   GALA_PRIVATE_KEY     — Publisher wallet private key for GalaChain signing
#   GALA_CHAINCODE_URL   — Deployed chaincode REST API URL on GalaChain gateway
#   GALA_REST_API        — GalaChain gateway base URL (optional, defaults to testnet)
#
# See: game-api/chaincode/.env.example for details
# ═══════════════════════════════════════════════════════

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Export GC_API_URL (fallback to GALA_API_URL if present)
      - name: Export GC_API_URL
        run: |
          if [ -n "${{ secrets.GC_API_URL }}" ]; then
            echo "GC_API_URL=${{ secrets.GC_API_URL }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.GALA_API_URL }}" ]; then
            echo "GC_API_URL=${{ secrets.GALA_API_URL }}" >> $GITHUB_ENV
          else
            echo "❌ No GC_API_URL or GALA_API_URL secret found – deployment will fail" && exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./game/package-lock.json
      - run: npm ci && npm run build
        working-directory: ./game
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 57.130.64.126 >> ~/.ssh/known_hosts
      - name: Deploy game static files
        run: scp -r ./game/dist/* root@57.130.64.126:/var/www/kleeblatt-space/game/
      - name: Deploy game API
        run: |
          scp -r ./game-api/*.py ./game-api/routers/ ./game-api/requirements.txt root@57.130.64.126:/opt/game-api/
          scp ./game-api/daily-awards.service ./game-api/daily-awards.timer root@57.130.64.126:/etc/systemd/system/
          ssh root@57.130.64.126 "systemctl daemon-reload && systemctl restart game-api && systemctl enable daily-awards.timer"
      - name: Deploy chaincode service
        run: |
          scp ./game-api/chaincode/server.mjs ./game-api/chaincode/package.json root@57.130.64.126:/opt/game-api/chaincode/
          scp ./game-api/chaincode/kleeblatt-chaincode.service root@57.130.64.126:/etc/systemd/system/
          ssh root@57.130.64.126 "cd /opt/game-api/chaincode && npm ci && systemctl daemon-reload && systemctl restart kleeblatt-chaincode || true"
      - name: Write chaincode .env from secrets
        run: |
          echo "GALA_PRIVATE_KEY=${{ secrets.GALA_PRIVATE_KEY }}" > /tmp/chaincode.env
          echo "GALA_CHAINCODE_URL=${{ secrets.GALA_CHAINCODE_URL }}" >> /tmp/chaincode.env
          echo "GALA_REST_API=${{ secrets.GALA_REST_API || 'https://gateway-testnet.galachain.com/api' }}" >> /tmp/chaincode.env
          echo "PORT=8002" >> /tmp/chaincode.env
          scp /tmp/chaincode.env root@57.130.64.126:/opt/game-api/chaincode/.env
          ssh root@57.130.64.126 "systemctl restart kleeblatt-chaincode || true"
      - uses: peter-evans/create-pull-request@v5
        with:
          base: main
          branch: deploy/update-logs
          title: "🚀 Deployed ${{ github.event.head_commit.sha }}"
          body: |
            ## Live Deployment
            - Source: ${{ github.ref }}
            - Live: https://game.kleeblatt.space/
            - Files: game/dist/*
          labels: 'deploy auto-update'
          reviewers: ${{ github.repository_owner }}
          assignees: ${{ github.actor }}
