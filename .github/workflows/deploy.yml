name: Auto Deploy with PR & Changelog
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./game/package-lock.json
      - run: npm ci && npm run build
        working-directory: ./game
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 57.130.64.126 >> ~/.ssh/known_hosts
      - name: Deploy game static files
        run: scp -r ./game/dist/* root@57.130.64.126:/var/www/kleeblatt-space/game/
      - name: Deploy game API
        run: |
          scp -r ./game-api/*.py ./game-api/routers/ ./game-api/requirements.txt root@57.130.64.126:/opt/game-api/
          scp ./game-api/daily-awards.service ./game-api/daily-awards.timer root@57.130.64.126:/etc/systemd/system/
          ssh root@57.130.64.126 "systemctl daemon-reload && systemctl restart game-api && systemctl enable daily-awards.timer"
      - name: Deploy chaincode service
        run: |
          scp ./game-api/chaincode/server.mjs ./game-api/chaincode/package.json root@57.130.64.126:/opt/game-api/chaincode/
          scp ./game-api/chaincode/kleeblatt-chaincode.service root@57.130.64.126:/etc/systemd/system/
          ssh root@57.130.64.126 "cd /opt/game-api/chaincode && npm ci && systemctl daemon-reload && systemctl restart kleeblatt-chaincode || true"
      - uses: peter-evans/create-pull-request@v5
        with:
          base: main
          branch: deploy/update-logs
          title: "🚀 Deployed ${{ github.event.head_commit.sha }}"
          body: |
            ## Live Deployment
            - Source: ${{ github.ref }}
            - Live: https://game.kleeblatt.space/
            - Files: game/dist/*
          labels: 'deploy auto-update'
          reviewers: ${{ github.repository_owner }}
          assignees: ${{ github.actor }}
