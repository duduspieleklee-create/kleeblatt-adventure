name: Auto Deploy with PR & Changelog
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./game/package-lock.json
      - run: npm ci && npm run build
        working-directory: ./game
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./game/dist
          publish_branch: gh-pages
      - uses: peter-evans/create-pull-request@v5
        with:
          base: main
          branch: deploy/update-logs
          title: "🚀 Deployed ${{ github.event.head_commit.sha }}"
          body: |
            ## Live Deployment
            - Source: ${{ github.ref }}
            - Live: https://kleeblatt.space/game
            - Files: game/dist/*
          labels: 'deploy auto-update'
          reviewers: ${{ github.repository_owner }}
          assignees: ${{ github.actor }}
