name: Workboard Auto-Status

on:
  push:
    branches: [main]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
  pull_request:
    types: [opened, closed, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  auto-update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find linked workboard cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for workboard card references..."

          CARD_ID=""

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_BODY="${{ github.event.pull_request.body || '' }}"
            COMMIT_MSG="${{ github.event.pull_request.title || '' }}"
            CARD_ID=$(printf "%s %s" "$PR_BODY" "$COMMIT_MSG" | grep -oP 'card[:\s]+([0-9a-f]{12})' | head -1 || true)
            if [ -n "$CARD_ID" ]; then
              CARD_ID=$(echo "$CARD_ID" | grep -oP '[0-9a-f]{12}')
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            COMMITS=$(printf "%s" "${{ toJson(github.event.commits) }}")
            CARD_ID=$(echo "$COMMITS" | grep -oP 'card[:\s]+([0-9a-f]{12})' | head -1 || true)
            if [ -n "$CARD_ID" ]; then
              CARD_ID=$(echo "$CARD_ID" | grep -oP '[0-9a-f]{12}')
            fi
          fi

          if [ -n "$CARD_ID" ]; then
            echo "Found card ID: $CARD_ID"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              if [ "${{ github.event.action }}" = "closed" ] && [ "${{ github.event.pull_request.merged }}" = "true" ]; then
                echo "PR merged - marking card as done"
                gh issue comment "$CARD_ID" --body "✅ PR merged - work completed." || true
              else
                echo "PR opened/updated - card in progress"
                gh issue comment "$CARD_ID" --body "🔄 PR opened/updated - work in progress." || true
              fi
            elif [ "${{ github.event_name }}" = "push" ]; then
              echo "Push to main - marking card as done"
              gh issue comment "$CARD_ID" --body "✅ Changes pushed to main - work completed." || true
            fi
          else
            echo "No workboard card ID found in event"
          fi
