name: Deploy game.kleeblatt.space

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/shared/**"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/deploy-game.yml"
  workflow_dispatch:

concurrency:
  group: deploy-game-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & deploy web + API
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build shared + api + web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npx turbo run build --filter=@kleeblatt/shared --filter=@kleeblatt/api --filter=@kleeblatt/web

      - name: Verify dist
        run: |
          test -f apps/web/dist/index.html
          test -f apps/api/dist/index.js
          ls -la apps/web/dist/ apps/api/dist/

      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$DEPLOY_PATH" ] || missing="$missing DEPLOY_PATH"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "Missing production secrets:$missing" >&2
            exit 1
          fi
          echo "Host=${DEPLOY_HOST} User=${DEPLOY_USER} Path=${DEPLOY_PATH}"

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          PORT="${DEPLOY_PORT:-22}"
          HOST="$(echo "$DEPLOY_HOST" | sed -e 's|^https\?://||' -e 's|/$||' -e 's/[[:space:]]//g')"
          ssh-keyscan -p "$PORT" -T 15 -H "$HOST" >> ~/.ssh/known_hosts

      - name: Rsync web dist
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          HOST="$(echo "$DEPLOY_HOST" | sed -e 's|^https\?://||' -e 's|/$||' -e 's/[[:space:]]//g')"
          PATH_DEST="$(echo "$DEPLOY_PATH" | sed 's|/*$|/|')"
          rsync -avz --delete \
            -e "ssh -p ${PORT} -o StrictHostKeyChecking=yes" \
            apps/web/dist/ \
            "${DEPLOY_USER}@${HOST}:${PATH_DEST}"

      - name: Rsync API app to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          API_REMOTE_PATH: ${{ secrets.DEPLOY_API_PATH }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          HOST="$(echo "$DEPLOY_HOST" | sed -e 's|^https\?://||' -e 's|/$||' -e 's/[[:space:]]//g')"
          API_PATH="${API_REMOTE_PATH:-/opt/kleeblatt-adventure}"
          rsync -avz --delete \
            -e "ssh -p ${PORT} -o StrictHostKeyChecking=yes" \
            --exclude node_modules --exclude .git --exclude .turbo --exclude apps/web \
            ./ "${DEPLOY_USER}@${HOST}:${API_PATH}/"
          rsync -avz \
            -e "ssh -p ${PORT} -o StrictHostKeyChecking=yes" \
            apps/api/dist/ "${DEPLOY_USER}@${HOST}:${API_PATH}/apps/api/dist/"
          rsync -avz \
            -e "ssh -p ${PORT} -o StrictHostKeyChecking=yes" \
            packages/shared/dist/ "${DEPLOY_USER}@${HOST}:${API_PATH}/packages/shared/dist/"

      - name: Write production .env from GitHub secrets & restart API
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          API_REMOTE_PATH: ${{ secrets.DEPLOY_API_PATH }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          HOST="$(echo "$DEPLOY_HOST" | sed -e 's|^https\?://||' -e 's|/$||' -e 's/[[:space:]]//g')"
          API_PATH="${API_REMOTE_PATH:-/opt/kleeblatt-adventure}"

          if [ -z "$SESSION_SECRET" ]; then
            echo "SESSION_SECRET is required in Environment production secrets" >&2
            exit 1
          fi

          {
            echo "NODE_ENV=production"
            echo "API_URL=https://game.kleeblatt.space"
            echo "WEB_URL=https://game.kleeblatt.space"
            echo "CORS_ORIGIN=https://game.kleeblatt.space"
            echo "API_PORT=4000"
            echo "SESSION_SECRET=${SESSION_SECRET}"
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
            echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}"
            echo "GOOGLE_CALLBACK_URL=https://game.kleeblatt.space/auth/google/callback"
            echo "AUTH_DEV_BYPASS=false"
          } > /tmp/kleeblatt.env

          scp -P "$PORT" -o StrictHostKeyChecking=yes \
            /tmp/kleeblatt.env \
            "${DEPLOY_USER}@${HOST}:${API_PATH}/.env"
          ssh -p "$PORT" -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${HOST}" \
            "chmod 600 ${API_PATH}/.env && cd ${API_PATH} && npm install --omit=dev && sudo systemctl restart kleeblatt-api && sleep 1 && curl -sf http://127.0.0.1:4000/health"
          rm -f /tmp/kleeblatt.env
