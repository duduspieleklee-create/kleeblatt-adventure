name: Deploy game.kleeblatt.space

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package*.json"
      - "game-config.json"
  workflow_dispatch:

concurrency:
  group: deploy-game-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx turbo run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p "${HOME}/.ssh"
          ssh-keyscan -H "${DEPLOY_HOST}" >> "${HOME}/.ssh/known_hosts"
          scp -o StrictHostKeyChecking=accept-new -r apps/web/dist apps/api/dist apps/api/package.json apps/web/package.json packages/shared/dist packages/shared/package.json package*.json game-config.json ecosystem.config.cjs \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
          ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -lc \"cd ${DEPLOY_PATH} && npm ci --production && (npx pm2 reload ecosystem.config.cjs --update-env 2>/dev/null || npx pm2 start ecosystem.config.cjs --update-env) && npx pm2 save\""
