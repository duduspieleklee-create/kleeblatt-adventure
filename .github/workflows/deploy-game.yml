name: Deploy game.kleeblatt.space

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - "game-config.json"
      - ".github/workflows/deploy-game.yml"
      - "scripts/server-deploy.sh"
  workflow_dispatch:
    inputs:
      force_api:
        description: "Force API reinstall + restart even if only web changed"
        type: boolean
        default: false

concurrency:
  group: deploy-game-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & deploy web + API
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed areas
        id: changes
        env:
          FORCE_API: ${{ inputs.force_api || false }}
        run: |
          set -euo pipefail
          WEB=false
          API=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WEB=true
            API=true
            if [ "$FORCE_API" = "true" ]; then API=true; fi
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              DIFF=$(git diff --name-only HEAD~1 HEAD || true)
            else
              DIFF=$(git ls-files)
            fi
            echo "$DIFF" | grep -qE '^apps/web/' && WEB=true || true
            echo "$DIFF" | grep -qE '^(apps/api/|packages/shared/|game-config\.json|package(-lock)?\.json|scripts/server-deploy\.sh|\.github/workflows/deploy-game\.yml)' && API=true || true
            if [ -z "${DIFF// }" ]; then WEB=true; API=true; fi
            if [ "$WEB" = false ] && [ "$API" = false ]; then
              WEB=true
              API=true
            fi
          fi
          echo "web=$WEB" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "Deploy scope: web=$WEB api=$API"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared + api + web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npx turbo run build --filter=@kleeblatt/shared --filter=@kleeblatt/api --filter=@kleeblatt/web

      - name: Verify build artifacts
        run: |
          set -euo pipefail
          test -f apps/web/dist/index.html
          test -f apps/api/dist/index.js
          test -f packages/shared/dist/index.js
          test -f game-config.json
          test -f scripts/server-deploy.sh
          ls -la apps/web/dist/ apps/api/dist/ packages/shared/dist/

      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$DEPLOY_PATH" ] || missing="$missing DEPLOY_PATH"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "Missing production secrets:$missing" >&2
            exit 1
          fi
          echo "Host=${DEPLOY_HOST} User=${DEPLOY_USER} Path=${DEPLOY_PATH}"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          PORT="${DEPLOY_PORT:-22}"
          HOST="$(echo "$DEPLOY_HOST" | sed -e 's|^https\?://||' -e 's|/$||' -e 's/[[:space:]]//g')"
          ssh-keyscan -p "$PORT" -T 15 -H "$HOST" >> ~/.ssh/known_hosts

      - name: Pack release bundle
        id: pack
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          SHORT="${SHA:0:12}"
          BUNDLE_DIR="/tmp/kleeblatt-release-${SHORT}"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR/web" \
            "$BUNDLE_DIR/api/apps/api" \
            "$BUNDLE_DIR/api/packages/shared" \
            "$BUNDLE_DIR/meta"

          cp -a apps/web/dist/. "$BUNDLE_DIR/web/"

          cp package.json package-lock.json game-config.json "$BUNDLE_DIR/api/"
          cp apps/api/package.json "$BUNDLE_DIR/api/apps/api/"
          mkdir -p "$BUNDLE_DIR/api/apps/api/dist"
          cp -a apps/api/dist/. "$BUNDLE_DIR/api/apps/api/dist/"
          if [ -d apps/api/drizzle ]; then
            cp -a apps/api/drizzle "$BUNDLE_DIR/api/apps/api/"
          fi
          cp packages/shared/package.json "$BUNDLE_DIR/api/packages/shared/"
          mkdir -p "$BUNDLE_DIR/api/packages/shared/dist"
          cp -a packages/shared/dist/. "$BUNDLE_DIR/api/packages/shared/dist/"

          cp scripts/server-deploy.sh "$BUNDLE_DIR/meta/server-deploy.sh"
          chmod +x "$BUNDLE_DIR/meta/server-deploy.sh"

          {
            echo "GIT_SHA=${SHA}"
            echo "WEB_CHANGED=${{ steps.changes.outputs.web }}"
            echo "API_CHANGED=${{ steps.changes.outputs.api }}"
            echo "LOCK_HASH=$(sha256sum package-lock.json | awk '{print $1}')"
            echo "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$BUNDLE_DIR/meta/release.env"

          TAR="/tmp/kleeblatt-release-${SHORT}.tar.gz"
          tar -C "$BUNDLE_DIR" --transform 's|^\./||' -czf "$TAR" .
          echo "tar=$TAR" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          ls -lh "$TAR"

      - name: Upload bundle & run remote deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          API_REMOTE_PATH: ${{ secrets.DEPLOY_API_PATH }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          WEB_CHANGED: ${{ steps.changes.outputs.web }}
          API_CHANGED: ${{ steps.changes.outputs.api }}
          TAR: ${{ steps.pack.outputs.tar }}
          SHORT: ${{ steps.pack.outputs.short }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          HOST="$(echo "$DEPLOY_HOST" | sed -e 's|^https\?://||' -e 's|/$||' -e 's/[[:space:]]//g')"
          WEB_PATH="$(echo "$DEPLOY_PATH" | sed 's|/*$||')"
          API_PATH="${API_REMOTE_PATH:-/opt/kleeblatt-adventure}"

          if [ -z "${SESSION_SECRET:-}" ]; then
            echo "SESSION_SECRET is required in Environment production secrets" >&2
            exit 1
          fi

          {
            echo "NODE_ENV=production"
            echo "API_URL=https://game.kleeblatt.space"
            echo "WEB_URL=https://game.kleeblatt.space"
            echo "CORS_ORIGIN=https://game.kleeblatt.space"
            echo "API_PORT=4000"
            echo "SESSION_SECRET=${SESSION_SECRET}"
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
            echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}"
            echo "GOOGLE_CALLBACK_URL=https://game.kleeblatt.space/auth/google/callback"
            echo "AUTH_DEV_BYPASS=false"
            [ -n "${DATABASE_URL:-}" ] && echo "DATABASE_URL=${DATABASE_URL}"
            [ -n "${REDIS_URL:-}" ] && echo "REDIS_URL=${REDIS_URL}"
          } > /tmp/kleeblatt.env.overlay

          scp -P "$PORT" -o StrictHostKeyChecking=yes \
            "$TAR" \
            /tmp/kleeblatt.env.overlay \
            "${DEPLOY_USER}@${HOST}:/tmp/"

          REMOTE_TAR="/tmp/$(basename "$TAR")"
          ssh -p "$PORT" -o StrictHostKeyChecking=yes "${DEPLOY_USER}@${HOST}" \
            "sudo bash -s" <<REMOTE
          set -euo pipefail
          export WEB_PATH="${WEB_PATH}"
          export API_PATH="${API_PATH}"
          export REMOTE_TAR="${REMOTE_TAR}"
          export SHORT="${SHORT}"
          export WEB_CHANGED="${WEB_CHANGED}"
          export API_CHANGED="${API_CHANGED}"
          export DEPLOY_USER="${DEPLOY_USER}"
          tar -xzf "${REMOTE_TAR}" -C /tmp "meta/server-deploy.sh"
          chmod +x /tmp/meta/server-deploy.sh
          /tmp/meta/server-deploy.sh
          REMOTE

          rm -f /tmp/kleeblatt.env.overlay

      - name: Public health check
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3 4 5 6; do
            if curl -sf "https://game.kleeblatt.space/api/health" | grep -q '"status":"ok"'; then
              echo "Public API health OK"
              ok=1
              break
            fi
            echo "public health wait $i/6"
            sleep 2
          done
          test "$ok" = 1
          curl -sf -o /dev/null -w "web_http=%{http_code}\n" "https://game.kleeblatt.space/"
