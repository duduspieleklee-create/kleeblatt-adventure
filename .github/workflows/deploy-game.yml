name: Deploy game.kleeblatt.space

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package*.json"
      - "game-config.json"
  workflow_dispatch:

concurrency:
  group: deploy-game-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          submodules: recursive
          lfs: true
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx turbo run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p "${HOME}/.ssh"
          ssh-keyscan -H "${DEPLOY_HOST}" >> "${HOME}/.ssh/known_hosts"

          # Quick SSH connectivity check with retries
          attempts=5
          for i in $(seq 1 $attempts); do
            echo "Attempt $i: testing SSH to ${DEPLOY_USER}@${DEPLOY_HOST}..."
            if ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_HOST}" 'echo connected' >/dev/null 2>&1; then
              echo "SSH reachable"
              break
            fi
            echo "SSH not reachable yet; sleeping before retry..."
            sleep $((i * 5))
            if [ "$i" -eq "$attempts" ]; then
              echo "ERROR: cannot reach ${DEPLOY_HOST} after ${attempts} attempts"
              exit 1
            fi
          done

          # Copy full workspace dirs + root files so npm install sees valid workspaces
          scp -o StrictHostKeyChecking=accept-new -r apps/ packages/ package*.json game-config.json ecosystem.config.cjs \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
          # Install production deps (npm install won't clean valid workspace dirs)
          ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -lc 'cd ${DEPLOY_PATH} && npm install --omit=dev'"
          # Start/restart API
          ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -lc 'cd ${DEPLOY_PATH} && (npx pm2 reload ecosystem.config.cjs --update-env 2>/dev/null || npx pm2 start eco[...]
