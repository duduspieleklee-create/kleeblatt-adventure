name: Contracts CI

on:
  push:
    branches: [main, bob_dev_branch, feat/**]
    paths:
      - 'contracts/**'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'

jobs:
  compile-and-test:
    name: Compile & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test

      - name: Upload artifacts (ABI + bytecode)
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          # Only the JSON artifact files — not the full cache dir
          path: contracts/artifacts/contracts/**/*.json
          if-no-files-found: error
          retention-days: 7
