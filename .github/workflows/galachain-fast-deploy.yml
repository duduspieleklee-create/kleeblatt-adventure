name: GalaChain Fast Testnet Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'game-api/chaincode/kleeblattcoin/**'
      - 'keys/**'
      - '.github/workflows/galachain-fast-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'game-api/chaincode/kleeblattcoin/**'
      - 'keys/**'
      - '.github/workflows/galachain-fast-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-kleeblattcoin

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Export GC_API_URL (fallback to GALA_REST_API if present)
      - name: Export GC_API_URL
        run: |
          if [ -n "${{ secrets.GC_API_URL }}" ]; then
            echo "GC_API_URL=${{ secrets.GC_API_URL }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.GALA_REST_API }}" ]; then
            echo "GC_API_URL=${{ secrets.GALA_REST_API }}" >> $GITHUB_ENV
          else
            echo "Error: No GC_API_URL or GALA_REST_API secret defined" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd game-api/chaincode/kleeblattcoin
          npm install

      - name: Run linters
        run: |
          cd game-api/chaincode/kleeblattcoin
          npx eslint src/**/*.ts || true

      - name: Run tests
        run: |
          cd game-api/chaincode/kleeblattcoin
          npm test || true

      - name: Build contract
        run: |
          cd game-api/chaincode/kleeblattcoin
          npm run build

      - name: Verify build output
        run: |
          ls -la game-api/chaincode/kleeblattcoin/dist/

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest game-api/chaincode/kleeblattcoin/

      - name: Run container security scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image ${{ env.IMAGE_NAME }}:latest --severity CRITICAL,HIGH

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          IMAGE_ID=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:latest $IMAGE_ID:$VERSION
          docker tag ${{ env.IMAGE_NAME }}:latest $IMAGE_ID:latest
          docker push $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Export GC_API_URL (fallback to GALA_REST_API if present)
      - name: Export GC_API_URL
        run: |
          if [ -n "${{ secrets.GC_API_URL }}" ]; then
            echo "GC_API_URL=${{ secrets.GC_API_URL }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.GALA_REST_API }}" ]; then
            echo "GC_API_URL=${{ secrets.GALA_REST_API }}" >> $GITHUB_ENV
          else
            echo "Error: No GC_API_URL or GALA_REST_API secret defined" >&2
            exit 1
          fi

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest Docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Setup GalaChain CLI
        run: |
          npm install -g @gala-chain/cli@^3.1.4

      - name: Configure GalaChain keys
        run: |
          mkdir -p keys
          echo "${{ secrets.GALA_ADMIN_PRIVATE_KEY }}" > keys/gc-admin-key
          echo "${{ secrets.GALA_PRIVATE_KEY }}" > keys/gc-dev-key

      - name: Preflight GalaChain API check
        run: |
          set -x
          curl -sSf -o /dev/null "${GC_API_URL}/health" || echo "Health check failed, continuing anyway"

      - name: Check existing chaincode registration
        run: |
          set -x
          galachain list --no-prompt || true

      - name: Register chaincode on GalaChain
        run: |
          set -x
          echo "GC_API_URL=${GC_API_URL}"
          echo "Chaincode public keys configured"
          galachain register "${{ secrets.GALA_PRIVATE_KEY }}" --no-prompt --verbose || {
            echo "::error::galachain register failed with exit code $?"
            exit 1
          }
        env:
          DEV_PRIVATE_KEY: ${{ secrets.GALA_PRIVATE_KEY }}
          ADMIN_PRIVATE_KEY: ${{ secrets.GALA_ADMIN_PRIVATE_KEY }}

      - name: Deploy to GalaChain Testnet
        run: |
          set -x
          IMAGE_ID=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          galachain deploy "$IMAGE_ID:${{ github.sha }}" "${{ secrets.GALA_PRIVATE_KEY }}" --no-prompt --verbose || {
            echo "::error::galachain deploy failed with exit code $?"
            exit 1
          }
        env:
          DEV_PRIVATE_KEY: ${{ secrets.GALA_PRIVATE_KEY }}

  # Lightweight security scan that runs in parallel for reporting only
  security-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Export GC_API_URL (fallback to GALA_REST_API if present)
      - name: Export GC_API_URL
        run: |
          if [ -n "${{ secrets.GC_API_URL }}" ]; then
            echo "GC_API_URL=${{ secrets.GC_API_URL }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.GALA_REST_API }}" ]; then
            echo "GC_API_URL=${{ secrets.GALA_REST_API }}" >> $GITHUB_ENV
          else
            echo "Error: No GC_API_URL or GALA_REST_API secret defined" >&2
            exit 1
          fi

      - name: Run fast security checks
        run: |
          echo "Running lightweight security checks..."
          # Check for common security issues without deep analysis
          find . -name "*.json" -exec grep -l "password\|secret\|token\|key\|credential" {} \; || echo "No obvious secrets found in JSON files"
          find . -name "*.yml" -o -name "*.yaml" -exec grep -l "password\|secret\|token\|key\|credential" {} \; || echo "No obvious secrets found in YAML files"