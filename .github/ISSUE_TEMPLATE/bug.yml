name: Bug Report
description: Etwas funktioniert nicht wie erwartet
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
      description: Beschreibe den Bug
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Wie reproduzieren?
      description: Schritte zum Reproduzieren
      placeholder: |
        1. Starte API + Web
        2. Login mit Google
        3. Klicke auf "Abenteuer starten"
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Was sollte passieren?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Bereich
      options:
        - API (apps/api)
        - Web (apps/web)
        - Phaser (Gameplay)
        - DB
        - Auth
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Fehlermeldungen
      description: Konsolen-Output, API-Response, etc.
      render: shell
