name: Feature Request
description: Neues Feature oder Verbesserung
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: Was soll gebaut werden?
      description: Klare Beschreibung des Features
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Warum?
      description: Welches Problem löst das? Welcher Prototyp-Schritt (P0–P7)?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Bereich
      options:
        - API (apps/api)
        - Web (apps/web)
        - Phaser (Gameplay)
        - DB / Migration
        - Config / game-config.json
        - Docs
        - CI/CD
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priorität
      options:
        - blocker (Prototyp blockiert)
        - high (dieser Sprint)
        - medium (nächster Sprint)
        - low (nice-to-have)
    validations:
      required: true
